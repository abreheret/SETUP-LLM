# Configuration des modeles du serveur LLM (lu par start.sh, switch.sh, status.sh).
# Fichier zsh : chaque profil est une fonction profile_<nom> qui definit ENGINE, ALIAS, MODEL et ARGS.
# Valeurs mesurees aux etapes 4, 4 bis et 4 ter (voir README.md).

# Profil lance par le service au demarrage (modifie par switch.sh).
DEFAULT_PROFILE=flash

PROFILES=(flash 27b 27b-dspark)

ROOT=/Users/amaury/DEV/SETUP-LLM
MODELS=$ROOT/models
PASSWORD_FILE=$ROOT/password
LOG_DIR=$ROOT/logs
HOST=0.0.0.0
PORT=8080
DSPARK_BIN=$ROOT/venv-dspark/bin/mlx-dspark
# Conteneur Docker (Colima) ou l'interface web execute ses outils ; dossier partage ~/LLM-fichiers.
TOOLS_CONTAINER=setup-llm-tools

# Parametres communs a llama-server.
# --reasoning-budget : sans plafond, la reflexion de Flash-Next pouvait depasser 40 000 tokens sans conclure.
# 24576 = niveau Max des clients ; une requete peut le changer avec thinking_budget_tokens (CLIENTS.md).
LLAMA_COMMON=(-ngl 99 -fa on --jinja
  --reasoning-budget 24576 --reasoning-budget-message "Time is up. I will now write the final answer.")

# Contexte : 2 slots, cache KV unifie en q8_0, 2 x 262144 tokens (contexte natif par slot).
# Pour 3 utilisateurs : passer -np a 3 (environ 174K garantis chacun, 262K pour un utilisateur seul).
CTX_ARGS=(-np 2 -kvu --kv-unified-per-slot 262144 -ctk q8_0 -ctv q8_0 -c 524288)

# Qwen3.8-Flash-Next UD-Q4_K_XL + tete MTP (modele principal).
# L'embedding n-gram (26,8 Gio) reste sur le SSD (mmap) au lieu de la memoire GPU.
# MTP : tete autonome Q8_0 (la version "shared" ne se charge pas avec le llama.cpp Homebrew),
# n-max 2 = meilleur compromis code/prose, stable a 2 utilisateurs.
profile_flash() {
  ENGINE=llama
  ALIAS=qwen3.8-flash-next
  MODEL=$MODELS/qwen3.8-flash-next/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
  ARGS=($CTX_ARGS
    -ot "per_layer_token_embd\.weight=CPU"
    -md $MODELS/qwen3.8-flash-next/MTP/mtp-Qwen3.8-Flash-Next-Q8_0.gguf
    --spec-type draft-mtp --spec-draft-n-max 2
    --mmproj $MODELS/qwen3.8-flash-next/mmproj/mmproj-F16.gguf)
}

# Qwen3.8-27B Q8_0 sous llama.cpp (secours, plusieurs utilisateurs en parallele).
profile_27b() {
  ENGINE=llama
  ALIAS=qwen3.8-27b
  MODEL=$MODELS/qwen3.8-27b/Qwen3.8-27B-Q8_0.gguf
  ARGS=($CTX_ARGS)
}

# Qwen3.8-27B 8 bits MLX + drafter DFlash 2 via mlx-dspark.
# 2 a 3,4 fois plus rapide que llama.cpp pour 1 utilisateur, mais traite les requetes une par une.
# mlx-dspark expose le nom du dossier comme nom de modele : mlx-alias/qwen3.8-27b est un lien
# vers le modele MLX, pour que les clients gardent le meme nom qu'avec le profil 27b.
profile_27b-dspark() {
  ENGINE=dspark
  ALIAS=qwen3.8-27b
  MODEL=$MODELS/mlx-alias/qwen3.8-27b
  ARGS=(--mode dflash --drafter $MODELS/qwen3.8-27b-dflash2 --context-window 262144)
}
